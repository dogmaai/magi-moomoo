# newsyslog.d entry for the local llama-server LaunchAgent log.
# Installed to /etc/newsyslog.d/magi-llama-server.conf by
# scripts/llama-server/install-llama-server-launchagent.sh.
#
# Rotate ~/Library/Logs/magi-llama-server.log at 5 MB, keep 5 bzip2'd
# generations. After rotating, newsyslog sends SIGTERM to the PID recorded by
# start-llama-server.sh; launchd KeepAlive restarts the server so it reopens
# the fresh log file.
#
# logfilename                                 owner:group mode count size when flags pid_file                                     sig
@HOME@/Library/Logs/magi-llama-server.log @USER@:wheel    600  5     5120 *    J     @HOME@/Library/Logs/magi-llama-server.pid 15
