# newsyslog.d entry for the TIALA Grafana Alloy agent log.
# Installed to /etc/newsyslog.d/magi-alloy.conf by install-alloy-launchagent.sh.
#
# Rotate ~/Library/Logs/magi-alloy.log at 5 MB, keep 5 bzip2'd generations.
# After rotating, newsyslog sends SIGTERM to the PID recorded by
# start-alloy.sh; launchd KeepAlive restarts the agent so it reopens the
# fresh log file (rename-rotation alone would keep writes on the old
# inode — the same reason ollama-auth-proxy rotates in-process, see #93).
#
# logfilename                          owner:group mode count size when flags pid_file                              sig
@HOME@/Library/Logs/magi-alloy.log @USER@:wheel    644  5     5120 *    J     @HOME@/Library/Logs/magi-alloy.pid 15
