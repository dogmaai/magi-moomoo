name: Auto Review on PR

on:
  pull_request:
    types: [opened, ready_for_review, synchronize, reopened]

permissions:
  pull-requests: write
  contents: read

jobs:
  auto-review:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Create auto review
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;

            // 既存の自動レビューを確認
            const existingReviews = await github.rest.pulls.listReviews({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number
            });

            // 自動レビューが既に存在する場合はスキップ
            const autoReviewExists = existingReviews.data.some(
              review => review.body && review.body.includes('自動レビュー')
            );

            if (autoReviewExists) {
              console.log('Auto review already exists, skipping creation...');
              return;
            }

            // 変更ファイルを取得
            const files = await github.rest.pulls.listFiles({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              per_page: 100
            });

            // ファイルタイプを分析
            const fileExtensions = {};
            files.data.forEach(file => {
              const ext = file.filename.split('.').pop() || 'no-extension';
              fileExtensions[ext] = (fileExtensions[ext] || 0) + 1;
            });

            // レビュー内容を構築
            const reviewLines = [
              '## 自動レビュー',
              '',
              '**PR情報:**',
              `- タイトル: ${pr.title}`,
              `- 作成者: @${pr.user.login}`,
              `- ターゲット: \`${pr.base.ref}\` ← \`${pr.head.ref}\``,
              `- 状態: ${pr.state}`,
              '',
              '**変更統計:**',
              `- ファイル数: ${pr.changed_files}`,
              `- 追加行: +${pr.additions}`,
              `- 削除行: -${pr.deletions}`,
              '',
            ];
            let reviewBody = reviewLines.join('\n');

            // ファイルタイプ別のチェック項目
            if (fileExtensions['js'] || fileExtensions['ts']) {
              reviewBody += `**JavaScript/TypeScript:**\n- [ ] 型定義の確認\n- [ ] 非同期処理のエラーハンドリング\n- [ ] Null/Undefinedの取り扱い\n`;
            }

            if (fileExtensions['py']) {
              reviewBody += `**Python:**\n- [ ] PEP 8準拠\n- [ ] 型ヒントの使用\n- [ ] 例外処理の適切性\n`;
            }

            if (fileExtensions['md']) {
              reviewBody += `**Markdown:**\n- [ ] 文書の整合性\n- [ ] リンクの有効性\n- [ ] 書式の適切性\n`;
            }

            if (fileExtensions['yml'] || fileExtensions['yaml']) {
              reviewBody += `**YAML:**\n- [ ] インデントの正確性\n- [ ] 必須フィールドの存在\n- [ ] 構文の有効性\n`;
            }

            reviewBody += `\n**一般的なチェック項目:**\n- [ ] コードの品質\n- [ ] テストカバレッジ\n- [ ] ドキュメントの更新\n- [ ] セキュリティの考慮\n- [ ] パフォーマンスへの影響\n\n---\n\n*このレビューは自動的に作成されました。詳細なレビューを実施します。*\n*レビュアー: @dogmaai が割り当てられています。*\n`;

            // レビューを作成
            await github.rest.pulls.createReview({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              event: 'COMMENT',
              body: reviewBody
            });

            console.log(`Auto review created for ${repo.owner}/${repo.repo}#${pr.number}`);

            // レビュアーを割り当て
            try {
              await github.rest.pulls.requestReviewers({
                owner: repo.owner,
                repo: repo.repo,
                pull_number: pr.number,
                reviewers: ['dogmaai']
              });
              console.log(`Reviewer assigned: @dogmaai`);
            } catch (error) {
              console.log(`Failed to assign reviewer: ${error.message}`);
            }

      - name: Add PR comment for tracking
        if: success()
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            const pr = context.payload.pull_request;
            const repo = context.repo;

            const commentBody = '🤖 **自動レビューが作成されました**\n\n- レビューID: 自動生成\n- 状態: 確認中\n- 対象: 全ファイル\n- 次のステップ: @dogmaai が詳細レビューを実施します\n\nレビューを確認する\n';

            await github.rest.issues.createComment({
              owner: repo.owner,
              repo: repo.repo,
              issue_number: pr.number,
              body: commentBody
            });

      - name: Mistral code review
        if: success()
        continue-on-error: true
        env:
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-large-4
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410 # v6.4.1
        with:
          script: |
            if (!process.env.MISTRAL_API_KEY) {
              console.log('MISTRAL_API_KEY not set, skipping Mistral review');
              return;
            }
            const pr = context.payload.pull_request;
            const repo = context.repo;

            // 同一 head SHA への重複レビュー防止
            const marker = `<!-- mistral-review sha=${pr.head.sha} -->`;
            const existing = await github.rest.pulls.listReviews({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              per_page: 100
            });
            if (existing.data.some(r => r.body && r.body.includes(marker))) {
              console.log('Mistral review already exists for this head SHA');
              return;
            }

            // diff 取得（大きすぎる場合は切り詰め）
            const diffResp = await github.rest.pulls.get({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              mediaType: { format: 'diff' }
            });
            let diff = diffResp.data;
            const MAX = 30000;
            if (diff.length > MAX) diff = diff.slice(0, MAX) + '\n... (truncated)';

            const res = await fetch('https://api.mistral.ai/v1/chat/completions', {
              method: 'POST',
              // 推論モデルは応答に時間がかかるため上限を設け、ハングでランナーを占有しない。
              signal: AbortSignal.timeout(300000),
              headers: {
                'Authorization': `Bearer ${process.env.MISTRAL_API_KEY}`,
                'Content-Type': 'application/json'
              },
              body: JSON.stringify({
                model: process.env.MISTRAL_MODEL,
                temperature: 0.2,
                // 推論モデルは thinking チャンクも max_tokens を消費するため余裕を持たせる
                max_tokens: 16000,
                messages: [
                  { role: 'system', content: 'あなたはシニアソフトウェアエンジニアです。以下のPull Requestのdiffをレビューし、日本語のMarkdownで回答してください。構成: ## 概要 / ## 良い点 / ## 指摘事項（各項目に重要度: 高/中/低を付記）/ ## 推奨アクション。問題がなければ指摘事項に「なし」と明記してください。' },
                  { role: 'user', content: `PRタイトル: ${pr.title}\n\n${diff}` }
                ]
              })
            });
            if (!res.ok) {
              throw new Error(`Mistral API ${res.status}: ${await res.text()}`);
            }
            const data = await res.json();
            // mistral-large-4 などの推論モデルは content を文字列ではなくチャンク配列
            // （thinking + text）で返す。text チャンクのみを連結し、思考過程は投稿しない。
            const choice = (data.choices && data.choices[0]) || {};
            const rawContent = choice.message && choice.message.content;
            // 文字列 content はそのまま。チャンク配列は type==='text' のみ連結し、
            // thinking など text 以外のチャンク（思考過程・将来の新種別）は意図的に投稿しない。
            const extractText = (content) => {
              if (typeof content === 'string') return content;
              if (!Array.isArray(content)) return '';
              return content.filter((c) => c && c.type === 'text' && typeof c.text === 'string').map((c) => c.text).join('');
            };
            // 本文が空のときは原因の手がかり（finish_reason と chunk 種別の集計）を出す。
            const describeEmpty = (content) => {
              let kinds = typeof content;
              if (Array.isArray(content)) {
                const counts = {};
                for (const c of content) { const k = (c && c.type) || typeof c; counts[k] = (counts[k] || 0) + 1; }
                kinds = Object.entries(counts).map(([k, n]) => `${k}×${n}`).join(', ') || 'empty array';
              }
              return `(no output — finish_reason=${choice.finish_reason || 'n/a'}, content=${kinds})`;
            };
            const reviewText = extractText(rawContent).trim() || describeEmpty(rawContent);
            // コスト監視用: finish_reason と usage（トークン数のみ、本文は含まない）を記録する。
            console.log('Mistral finish_reason:', choice.finish_reason, 'usage:', JSON.stringify(data.usage || {}));

            await github.rest.pulls.createReview({
              owner: repo.owner,
              repo: repo.repo,
              pull_number: pr.number,
              event: 'COMMENT',
              body: `${marker}\n## 🧠 Mistral レビュー (\`${process.env.MISTRAL_MODEL}\`)\n\n${reviewText}`
            });
            console.log('Mistral review posted');
